name: News on Telegram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get news
        run: curl -sSL "https://newsapi.org/v2/top-headlines?country=us&category=business&apiKey=${NEWS_API_KEY}" | jq '.articles[0]' > ./news.json
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Send message
        run: curl -sSL -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" -d chat_id=${TELEGRAM_CHATID} -d text=$( cat ./news.json | jq '.title,.url' | sed -e 's/"//ig' )
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
