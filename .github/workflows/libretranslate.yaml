name: LibreTranslate

on:
  workflow_dispatch:
    inputs:
      QUERY:
        required: true
        description: Query to translate

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Telegram
        run: |
          docker run -d -p 5000:5000 libretranslate/libretranslate --load-only=en,pt
      - name: Wait seconds
        run: sleep 10
      - name: Write input
        run: echo ${{ inputs.QUERY }}
      - name: Translate query
        run: |
          curl -sSL -X 'POST'   'http://localhost:5000/translate'   -H 'accept: application/json'   -H 'Content-Type: application/x-www-form-urlencoded'   -d 'q=hello+world&source=en&target=pt&format=text&alternatives=1&api_key=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx' | jq '.translatedText'
